spring.application.name=staypilot

# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:staypilot}
spring.datasource.username=${POSTGRES_USER:staypilot}
spring.datasource.password=${POSTGRES_PASSWORD:staypilot_dev}
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
staypilot.jwt.secret=${JWT_SECRET:dev-only-secret-key-must-be-at-least-64-characters-long-change-in-production-immediately}
staypilot.jwt.access-token-expiry-ms=${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
staypilot.jwt.refresh-token-expiry-ms=${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

# Logging
logging.level.com.staypilot=DEBUG
logging.level.org.springframework.security=INFO

# Mail (optional)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
